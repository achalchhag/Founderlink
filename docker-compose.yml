      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  startup-postgres:
    container_name: founderlink-startup-postgres
