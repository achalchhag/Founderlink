    environment:
      POSTGRES_DB: ${STARTUP_DB_NAME:-founderlink_startup}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5434:5432"
    volumes:
      - startup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  startup-service:
    container_name: founderlink-startup-service
    build:
      context: .
