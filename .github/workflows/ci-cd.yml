name: FounderLink Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Java Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build All Microservices with Maven
        run: |
          mvn clean compile

      - name: Run Microservice Unit & Integration Tests
        run: |
          mvn test

  docker-build:
    name: Build Docker Containers
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - profile-service
          - discovery-service
          - startup-service
          - matching-service
          - chat-service
          - notification-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: founderlink/${{ matrix.service }}:latest

  docker-compose-validate:
    name: Validate Docker Compose Stack
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          AUTH_JWT_ISSUER: founderlink-auth-service
          AUTH_JWT_PRIVATE_KEY: 
          AUTH_JWT_PUBLIC_KEY: 
        run: |
          docker compose config --quiet
          echo "Docker compose stack configuration verified successfully!"
