spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/founderlink_auth}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    access-token-seconds: ${AUTH_JWT_ACCESS_TOKEN_SECONDS:900}
    private-key: ${AUTH_JWT_PRIVATE_KEY}
    public-key: ${AUTH_JWT_PUBLIC_KEY}
