server:
  port: ${SERVER_PORT:8083}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    public-key: ${AUTH_JWT_PUBLIC_KEY}
